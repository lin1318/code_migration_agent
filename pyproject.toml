[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "code-migration-agent"
version = "0.1.0"
description = "A code migration agent"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "langgraph>=1,<2",
    "openai>=1,<3",
    "pydantic>=2,<3",
    "python-dotenv>=1,<2",
    "PyYAML>=6,<7",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[project.scripts]
code-migration-agent = "agent.cli:main"

[tool.setuptools]
packages = [
    "agent",
    "agent.execution",
    "knowledge",
    "llm",
    "models",
    "tools",
    "workflow",
]
