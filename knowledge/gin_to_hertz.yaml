rules:
  - rule_id: gin.logger
    source_package: github.com/gin-gonic/gin
    source_symbol: Logger
    target_package: github.com/hertz-contrib/logger/accesslog
    target_symbol: New
    migration_category: middleware_control
    confidence: review
    required_imports:
      - github.com/hertz-contrib/logger/accesslog
    notes: Replace Gin request logging middleware with Hertz accesslog middleware and review log format compatibility.
    documentation_notes: https://github.com/hertz-contrib/logger/tree/main/accesslog

  - rule_id: gin.recovery
    source_package: github.com/gin-gonic/gin
    source_symbol: Recovery
    target_package: github.com/cloudwego/hertz/pkg/app/middlewares/server/recovery
    target_symbol: Recovery
    migration_category: middleware_control
    confidence: exact
    required_imports:
      - github.com/cloudwego/hertz/pkg/app/middlewares/server/recovery
    notes: Replace Gin recovery middleware with Hertz server recovery middleware.
    documentation_notes: https://github.com/cloudwego/hertz/tree/develop/pkg/app/middlewares/server/recovery

  - rule_id: gin.context.abort
    source_package: github.com/gin-gonic/gin
    source_symbol: (*Context).Abort
    target_package: github.com/cloudwego/hertz/pkg/app
    target_symbol: (*RequestContext).Abort
    migration_category: middleware_control
    confidence: exact
    required_imports:
      - github.com/cloudwego/hertz/pkg/app
    notes: Hertz RequestContext.Abort terminates subsequent handler execution.
    documentation_notes: https://www.cloudwego.io/docs/hertz/tutorials/basic-feature/context/request/

  - rule_id: gin.context.post-form
    source_package: github.com/gin-gonic/gin
    source_symbol: (*Context).PostForm
    target_package: github.com/cloudwego/hertz/pkg/app
    target_symbol: (*RequestContext).PostForm
    migration_category: request_access
    confidence: exact
    required_imports:
      - github.com/cloudwego/hertz/pkg/app
    notes: Hertz RequestContext.PostForm retrieves the first form value by key.
    documentation_notes: https://www.cloudwego.io/docs/hertz/tutorials/basic-feature/context/request/

  - rule_id: gin.context.save-uploaded-file
    source_package: github.com/gin-gonic/gin
    source_symbol: (*Context).SaveUploadedFile
    target_package: github.com/cloudwego/hertz/pkg/app
    target_symbol: (*RequestContext).SaveUploadedFile
    migration_category: request_access
    confidence: exact
    required_imports:
      - github.com/cloudwego/hertz/pkg/app
    notes: Hertz RequestContext.SaveUploadedFile saves a multipart file to the destination path.
    documentation_notes: https://www.cloudwego.io/docs/hertz/tutorials/basic-feature/context/request/

  - rule_id: gin.context.bind
    source_package: github.com/gin-gonic/gin
    source_symbol: (*Context).Bind
    target_package: github.com/cloudwego/hertz/pkg/app
    target_symbol: (*RequestContext).Bind
    migration_category: data_binding
    confidence: review
    required_imports:
      - github.com/cloudwego/hertz/pkg/app
    notes: Hertz RequestContext.Bind performs content-aware binding; review Gin-specific validation and automatic error-response behavior.
    documentation_notes: https://www.cloudwego.io/docs/hertz/tutorials/basic-feature/binding-and-validate/

  - rule_id: gin.engine.staticfs
    source_package: github.com/gin-gonic/gin
    source_symbol: (*Engine).StaticFS
    target_package: github.com/cloudwego/hertz/pkg/common/adaptor
    target_operations:
      - operation: replace_static_file_route
        symbol: github.com/cloudwego/hertz/pkg/common/adaptor.HertzHandler
        notes: Wrap net/http FileServer and preserve the route prefix using an explicit wildcard route.
    migration_category: routing
    confidence: review
    required_imports:
      - github.com/cloudwego/hertz/pkg/common/adaptor
      - net/http
    notes: Hertz documents serving net/http file handlers through adaptor.HertzHandler; review wildcard routing and filesystem arguments.
    documentation_notes: https://www.cloudwego.io/docs/hertz/tutorials/basic-feature/http-adaptor/

  - rule_id: gin-swagger.wrap-handler
    source_package: github.com/swaggo/gin-swagger
    source_symbol: WrapHandler
    target_package: github.com/cloudwego/hertz/pkg/common/adaptor
    target_operations:
      - operation: replace_http_handler_adapter
        symbol: github.com/cloudwego/hertz/pkg/common/adaptor.HertzHandler
        value: github.com/swaggo/http-swagger.WrapHandler
        notes: Replace the Gin Swagger handler with the official net/http Swagger handler wrapped for Hertz.
    migration_category: routing
    confidence: review
    required_imports:
      - github.com/cloudwego/hertz/pkg/common/adaptor
      - github.com/swaggo/http-swagger
    notes: Use Hertz's recommended HTTP adaptor migration for Swagger and review any custom Gin Swagger options.
    dependency_kind: external_dependency
    resolution_strategy: replace_dependency
    documentation_notes: https://www.cloudwego.io/docs/hertz/tutorials/third-party/middleware/swagger/

  - rule_id: gin-contrib.cors.default
    source_package: github.com/gin-contrib/cors
    source_symbol: Default
    target_package: github.com/hertz-contrib/cors
    target_symbol: Default
    migration_category: middleware_control
    confidence: exact
    required_imports:
      - github.com/hertz-contrib/cors
    notes: Replace Gin CORS middleware with the deterministic Hertz CORS equivalent.
    dependency_kind: external_dependency
    resolution_strategy: replace_dependency
    documentation_notes: Preserve the existing default CORS configuration behavior.

  - rule_id: gin.default
    source_package: github.com/gin-gonic/gin
    source_symbol: Default
    target_package: github.com/cloudwego/hertz/pkg/app/server
    target_symbol: Default
    migration_category: server_initialization
    confidence: exact
    required_imports:
      - github.com/cloudwego/hertz/pkg/app/server
    notes: Hertz server.Default creates an engine with its default middleware.

  - rule_id: gin.new
    source_package: github.com/gin-gonic/gin
    source_symbol: New
    target_package: github.com/cloudwego/hertz/pkg/app/server
    target_symbol: New
    migration_category: server_initialization
    confidence: exact
    required_imports:
      - github.com/cloudwego/hertz/pkg/app/server
    notes: Hertz server.New creates an engine without installing default middleware.

  - rule_id: gin.engine.get
    source_package: github.com/gin-gonic/gin
    source_symbol: (*Engine).GET
    target_package: github.com/cloudwego/hertz/pkg/app/server
    target_symbol: (*Hertz).GET
    migration_category: routing
    confidence: exact
    required_imports:
      - github.com/cloudwego/hertz/pkg/app/server
    notes: Preserve the route path and handlers after adapting handler signatures.

  - rule_id: gin.engine.post
    source_package: github.com/gin-gonic/gin
    source_symbol: (*Engine).POST
    target_package: github.com/cloudwego/hertz/pkg/app/server
    target_symbol: (*Hertz).POST
    migration_category: routing
    confidence: exact
    required_imports:
      - github.com/cloudwego/hertz/pkg/app/server
    notes: Preserve the route path and handlers after adapting handler signatures.

  - rule_id: gin.engine.put
    source_package: github.com/gin-gonic/gin
    source_symbol: (*Engine).PUT
    target_package: github.com/cloudwego/hertz/pkg/app/server
    target_symbol: (*Hertz).PUT
    migration_category: routing
    confidence: exact
    required_imports:
      - github.com/cloudwego/hertz/pkg/app/server
    notes: Preserve the route path and handlers after adapting handler signatures.

  - rule_id: gin.engine.delete
    source_package: github.com/gin-gonic/gin
    source_symbol: (*Engine).DELETE
    target_package: github.com/cloudwego/hertz/pkg/app/server
    target_symbol: (*Hertz).DELETE
    migration_category: routing
    confidence: exact
    required_imports:
      - github.com/cloudwego/hertz/pkg/app/server
    notes: Preserve the route path and handlers after adapting handler signatures.

  - rule_id: gin.engine.group
    source_package: github.com/gin-gonic/gin
    source_symbol: (*Engine).Group
    target_package: github.com/cloudwego/hertz/pkg/app/server
    target_symbol: (*Hertz).Group
    migration_category: routing
    confidence: exact
    required_imports:
      - github.com/cloudwego/hertz/pkg/app/server
    notes: Hertz returns a route.RouterGroup with the same path-prefix behavior.

  - rule_id: gin.engine.use
    source_package: github.com/gin-gonic/gin
    source_symbol: (*Engine).Use
    target_package: github.com/cloudwego/hertz/pkg/app/server
    target_symbol: (*Hertz).Use
    migration_category: middleware_control
    confidence: review
    required_imports:
      - github.com/cloudwego/hertz/pkg/app
      - github.com/cloudwego/hertz/pkg/app/server
    notes: Adapt every middleware to the Hertz app.HandlerFunc signature before registration.

  - rule_id: gin.router_group.get
    source_package: github.com/gin-gonic/gin
    source_symbol: (*RouterGroup).GET
    target_package: github.com/cloudwego/hertz/pkg/route
    target_symbol: (*RouterGroup).GET
    migration_category: routing
    confidence: exact
    required_imports: []
    notes: Preserve the route path and handlers after adapting handler signatures.

  - rule_id: gin.router_group.post
    source_package: github.com/gin-gonic/gin
    source_symbol: (*RouterGroup).POST
    target_package: github.com/cloudwego/hertz/pkg/route
    target_symbol: (*RouterGroup).POST
    migration_category: routing
    confidence: exact
    required_imports: []
    notes: Preserve the route path and handlers after adapting handler signatures.

  - rule_id: gin.router_group.put
    source_package: github.com/gin-gonic/gin
    source_symbol: (*RouterGroup).PUT
    target_package: github.com/cloudwego/hertz/pkg/route
    target_symbol: (*RouterGroup).PUT
    migration_category: routing
    confidence: exact
    required_imports: []
    notes: Preserve the route path and handlers after adapting handler signatures.

  - rule_id: gin.router_group.delete
    source_package: github.com/gin-gonic/gin
    source_symbol: (*RouterGroup).DELETE
    target_package: github.com/cloudwego/hertz/pkg/route
    target_symbol: (*RouterGroup).DELETE
    migration_category: routing
    confidence: exact
    required_imports: []
    notes: Preserve the route path and handlers after adapting handler signatures.

  - rule_id: gin.router_group.group
    source_package: github.com/gin-gonic/gin
    source_symbol: (*RouterGroup).Group
    target_package: github.com/cloudwego/hertz/pkg/route
    target_symbol: (*RouterGroup).Group
    migration_category: routing
    confidence: exact
    required_imports: []
    notes: Preserve the nested route prefix and inherited handler chain.

  - rule_id: gin.router_group.use
    source_package: github.com/gin-gonic/gin
    source_symbol: (*RouterGroup).Use
    target_package: github.com/cloudwego/hertz/pkg/route
    target_symbol: (*RouterGroup).Use
    migration_category: middleware_control
    confidence: review
    required_imports:
      - github.com/cloudwego/hertz/pkg/app
    notes: Adapt every group middleware to the Hertz app.HandlerFunc signature before registration.

  - rule_id: gin.context
    source_package: github.com/gin-gonic/gin
    source_symbol: Context
    target_package: github.com/cloudwego/hertz/pkg/app
    target_symbol: RequestContext
    migration_category: context_type
    confidence: review
    required_imports:
      - context
      - github.com/cloudwego/hertz/pkg/app
    notes: Hertz handlers also receive a standard context.Context parameter.

  - rule_id: gin.handler_func
    source_package: github.com/gin-gonic/gin
    source_symbol: HandlerFunc
    target_package: github.com/cloudwego/hertz/pkg/app
    target_symbol: HandlerFunc
    migration_category: handler_type
    confidence: review
    required_imports:
      - context
      - github.com/cloudwego/hertz/pkg/app
    notes: Adapt handler signatures to func(context.Context, *app.RequestContext).

  - rule_id: gin.context.param
    source_package: github.com/gin-gonic/gin
    source_symbol: (*Context).Param
    target_package: github.com/cloudwego/hertz/pkg/app
    target_symbol: (*RequestContext).Param
    migration_category: request_access
    confidence: exact
    required_imports:
      - github.com/cloudwego/hertz/pkg/app
    notes: The path-parameter method has equivalent call semantics.

  - rule_id: gin.context.query
    source_package: github.com/gin-gonic/gin
    source_symbol: (*Context).Query
    target_package: github.com/cloudwego/hertz/pkg/app
    target_symbol: (*RequestContext).Query
    migration_category: request_access
    confidence: exact
    required_imports:
      - github.com/cloudwego/hertz/pkg/app
    notes: The query-parameter method has equivalent call semantics.

  - rule_id: gin.context.json
    source_package: github.com/gin-gonic/gin
    source_symbol: (*Context).JSON
    target_package: github.com/cloudwego/hertz/pkg/app
    target_symbol: (*RequestContext).JSON
    migration_category: response_rendering
    confidence: exact
    required_imports:
      - github.com/cloudwego/hertz/pkg/app
    notes: Preserve the status code and response object arguments.

  - rule_id: gin.h
    source_package: github.com/gin-gonic/gin
    source_symbol: H
    target_package: github.com/cloudwego/hertz/pkg/common/utils
    target_symbol: H
    migration_category: data_structure
    confidence: exact
    required_imports:
      - github.com/cloudwego/hertz/pkg/common/utils
    notes: Replace gin.H composite literals with utils.H.

  - rule_id: gin.context.should_bind_json
    source_package: github.com/gin-gonic/gin
    source_symbol: (*Context).ShouldBindJSON
    target_package: github.com/cloudwego/hertz/pkg/app
    target_symbol: (*RequestContext).BindAndValidate
    migration_category: data_binding
    confidence: review
    required_imports:
      - github.com/cloudwego/hertz/pkg/app
    notes: Review binding tags and validation behavior; Hertz binding may inspect more than JSON.

  - rule_id: gin.context.abort_with_status_json
    source_package: github.com/gin-gonic/gin
    source_symbol: (*Context).AbortWithStatusJSON
    target_package: github.com/cloudwego/hertz/pkg/app
    target_operations:
      - operation: call
        symbol: (*RequestContext).Abort
      - operation: call
        symbol: (*RequestContext).JSON
    migration_category: response_rendering
    confidence: review
    required_imports:
      - github.com/cloudwego/hertz/pkg/app
    notes: Abort the Hertz chain, then write the JSON response with the original status and object.

  - rule_id: gin.context.next
    source_package: github.com/gin-gonic/gin
    source_symbol: (*Context).Next
    target_package: github.com/cloudwego/hertz/pkg/app
    target_operations:
      - operation: replace_call
        symbol: (*RequestContext).Next
      - operation: add_argument
        value: context.Context
    migration_category: middleware_control
    confidence: review
    required_imports:
      - context
      - github.com/cloudwego/hertz/pkg/app
    notes: Pass the standard context.Context handler parameter to RequestContext.Next.
